version: 2

# Dependabot keeps the npm and GitHub Actions dependency graphs current.
# Weekly cadence on Monday morning (UTC) avoids the Friday-deploy trap and
# gives us a quiet window to triage updates before the work week begins.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Cooldown (added 2026-05-23) - mitigates fresh-release supply-chain attacks (zizmor/dependabot-cooldown)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - npm
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        # "@vitest/*" gehoert hierher (2026-09-27): @vitest/coverage-v8 pinnt vitest
        # per peerDependency EXAKT (4.1.11 <-> 4.1.11). Getrennt gruppiert entstanden
        # zwei PRs, die jeder fuer sich nicht aufloesbar waren (ERESOLVE): #191
        # (vitest 5, coverage-v8 bleibt 4) und #180 (coverage-v8 5, vitest bleibt 4)
        # -- beide mit rotem unit/e2e. Waechter: toolchain-contract.test.js leitet
        # exakte Peer-Pins aus der Lockdatei ab und verlangt dieselbe Gruppe.
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      testing:
        patterns:
          - "@playwright/*"
          - "@testing-library/*"
          - "jsdom"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Cooldown (added 2026-05-23) - mitigates fresh-release supply-chain attacks (zizmor/dependabot-cooldown)
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
    # Private reusable workflow (2026-09-27, Session-Bericht 09-21 Option A):
    # mobile-render.yml ruft marcohost33-maker/coworkerz-ci auf. Das Repo ist
    # privat und gehoert einem BENUTZERkonto; den Schalter "Dependabot darf private
    # Repos lesen" gibt es nur fuer Organisationen. Folge war ein jede Woche roter
    # Updater-Lauf (git_dependencies_not_reachable, z.B. 34812276520, 35567389769),
    # der auch die uebrigen Actions-Updates dieses Blocks gefaehrdete.
    # Ausgeschlossen wird GENAU diese eine Datei (sie hat nur die eine `uses:`-Zeile),
    # nicht ein Glob: jede neue Workflow-Datei bleibt automatisch unter Dependabot.
    # Preis, bewusst angenommen: den coworkerz-ci-Pin in mobile-render.yml pflegt
    # ein Mensch per PR -- Dependabot konnte ihn ohnehin nie aktualisieren.
    # Waechter: tests/unit/toolchain-contract.test.js (keine veraltete Ausnahme,
    # kein privater Aufruf ausserhalb der Ausnahme).
    exclude-paths:
      - ".github/workflows/mobile-render.yml"

# Cooldown configuration (added 2026-05-23 to address zizmor/dependabot-cooldown).
# Each updater waits N days after a new release before opening a PR. This
# mitigates supply-chain attacks via fresh malicious versions (recent
# precedent: xz-utils 5.6.0, eslint-config-prettier 8.10.1).
# Note: Dependabot reads the per-package-ecosystem cooldown above; this
# block is a fallback for ecosystems without their own cooldown entry.
