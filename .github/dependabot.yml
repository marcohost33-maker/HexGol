version: 2

# Dependabot keeps the npm and GitHub Actions dependency graphs current.
# Weekly cadence on Monday morning (UTC) avoids the Friday-deploy trap and
# gives us a quiet window to triage updates before the work week begins.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Cooldown (added 2026-05-23) - mitigates fresh-release supply-chain attacks (zizmor/dependabot-cooldown)
    cooldown:
      default-days: 7
    # React 19.3 akzeptiert (Marco 2026-11-02, mit dem Bundle-Budget aus
    # scripts/verify-bundle-size.mjs): Patches laufen durch, ein neuer Minor
    # oder Major wird bewusst gehoben, nicht per Dependabot.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - npm
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        # "@vitest/*" gehoert hierher (2026-09-27): @vitest/coverage-v8 pinnt vitest
        # per peerDependency EXAKT (4.1.11 <-> 4.1.11). Getrennt gruppiert entstanden
        # zwei PRs, die jeder fuer sich nicht aufloesbar waren (ERESOLVE): #191
        # (vitest 5, coverage-v8 bleibt 4) und #180 (coverage-v8 5, vitest bleibt 4)
        # -- beide mit rotem unit/e2e. Waechter: toolchain-contract.test.js leitet
        # exakte Peer-Pins aus der Lockdatei ab und verlangt dieselbe Gruppe.
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      testing:
        patterns:
          - "@playwright/*"
          - "@testing-library/*"
          - "jsdom"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Cooldown (added 2026-05-23) - mitigates fresh-release supply-chain attacks (zizmor/dependabot-cooldown)
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
    # Keine exclude-paths (2026-11-02): Die Ausnahme fuer mobile-render.yml
    # (2026-09-27, git_dependencies_not_reachable auf dem privaten coworkerz-ci,
    # Laeufe 34812276520, 35567389769) ist seit #204 (2026-10-16) gegenstandslos:
    # mobile-render.yml ist inline und ruft kein privates Reusable mehr auf. Eine
    # verbliebene Ausnahme haette dessen checkout/setup-node-Pins still von
    # Updates ausgenommen. Waechter: tests/unit/toolchain-contract.test.js (jeder
    # private Aufruf muss ausgenommen sein, keine Ausnahme ohne privaten Aufruf).

# Cooldown configuration (added 2026-05-23 to address zizmor/dependabot-cooldown).
# Each updater waits N days after a new release before opening a PR. This
# mitigates supply-chain attacks via fresh malicious versions (recent
# precedent: xz-utils 5.6.0, eslint-config-prettier 8.10.1).
# Note: Dependabot reads the per-package-ecosystem cooldown above; this
# block is a fallback for ecosystems without their own cooldown entry.
