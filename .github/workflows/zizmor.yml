# zizmor — static analysis for GitHub Actions workflows
# Docs: https://docs.zizmor.sh + https://github.com/zizmorcore/zizmor-action
name: Workflow Security Audit (zizmor)

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  schedule:
    - cron: "13 6 * * 1"   # Mondays 06:13 UTC

concurrency:
  # Der Schedule-Lauf soll NICHT abgebrochen werden koennen (er ist der einzige
  # regelmaessige Security-Blick); deshalb haengt die Gruppe am ref UND am Event.
  group: zizmor-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: zizmor workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to Code Scanning

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Bis 2026-10-16 lief dieser Job in zwei Durchgaengen: mobile-render.yml rief
      # einen Reusable Workflow aus dem privaten Repo marcohost33-maker/coworkerz-ci
      # auf, den der GITHUB_TOKEN nicht lesen kann, und musste deshalb von den
      # Online-Audits ausgenommen werden. Mit dem Inlining (PR #204) ist der Grund
      # entfallen -- die Ablaufbedingung der Ausnahme hat das selbst gemeldet. Jetzt
      # laufen alle Audits, auch die Online-Audits, ueber jede Workflow-Datei.
      - name: Run zizmor (alle Dateien, inkl. Online-Audits)
        # zizmor exits non-zero bei Findings -> dieser Step GATET die CI (rot = blockt merge).
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e  # v0.7.1
        with:
          inputs: "."
          persona: regular
          online-audits: true
          advanced-security: false
          annotations: true
