name: update-snapshots

# Manual snapshot refresh: run with workflow_dispatch when a deliberate
# visual change has been merged into App.jsx and the committed baselines
# need to follow. The job pushes the updated PNGs back to the source
# branch as a single commit named "chore(snapshots): refresh baselines".
#
# We run inside the same Microsoft Playwright Docker image used by
# visual-regression.yml so the baselines committed here match exactly what
# CI later compares against. Without this lockstep, snapshots refreshed on
# a developer laptop would always diff in CI.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to refresh snapshots on"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.0
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # persist-credentials: must stay TRUE here — this workflow pushes
          # the refreshed snapshots back to the branch, which needs the
          # checkout-stored credential. The push is the entire point of this
          # job. zizmor/artipacked is acknowledged as intentional here.

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.0.0
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.2
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (skip if cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build production bundle
        run: npm run build

      - name: Update Playwright snapshots
        run: npx playwright test --update-snapshots
        env:
          CI: "true"
          HOME: /root

      - name: Commit refreshed snapshots
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- tests/e2e/__snapshots__; then
            echo "No snapshot changes detected"
            exit 0
          fi
          git add tests/e2e/__snapshots__
          git commit -m "chore(snapshots): refresh baselines"
          git push origin HEAD:${{ github.event.inputs.branch }}
