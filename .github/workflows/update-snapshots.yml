name: update-snapshots

# Manual snapshot refresh: run with workflow_dispatch when a deliberate
# visual change has been merged into App.jsx and the committed baselines
# need to follow. The job pushes the updated PNGs back to the source
# branch as a single commit named "chore(snapshots): refresh baselines".
#
# We run inside the same Microsoft Playwright Docker image used by
# visual-regression.yml so the baselines committed here match exactly what
# CI later compares against. Without this lockstep, snapshots refreshed on
# a developer laptop would always diff in CI.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to refresh snapshots on"
        required: true
        default: "main"

# Schreibrecht NUR im Job, der wirklich zurueckschreibt -- nicht auf Workflow-Ebene,
# wo es jeder kuenftige Job erbte. Dieser Job fuehrt Repo-Code aus
# (`playwright test --update-snapshots`), waehrend ein schreibfaehiges Token im
# Kontext liegt; die Rechte gehoeren deshalb so eng wie moeglich gefasst
# (zizmor `excessive-permissions`, Aegis-Audit 2026-08-11, P2).
permissions: {}

# KEIN cancel-in-progress: der Lauf committet Snapshots zurueck. Ein Abbruch mitten
# im Schreiben waere schlimmer als ein Doppellauf -- deshalb nur serialisieren.
concurrency:
  group: update-snapshots-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    container:
      # tag v1.60.0-noble pinned by digest (resolved 2026-06-22)
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --user 1001:1001
    steps:
      # persist-credentials must stay TRUE here: this workflow pushes the
      # refreshed snapshots back to the branch, which needs the checkout-stored
      # credential. The push is the entire point of this job. The artipacked
      # risk is accepted intentionally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (skip if cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build production bundle
        run: npm run build

      - name: Update Playwright snapshots
        run: npx playwright test --update-snapshots
        env:
          CI: "true"
          HOME: /root

      - name: Commit refreshed snapshots
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add ZUERST, dann diff --cached: erkennt auch NEUE (untracked)
          # Baselines. Das alte `git diff --quiet` sah nur getrackte Aenderungen
          # -> neue Baselines wurden nie committet (Bootstrap war unmoeglich). Fix 2026-06-01.
          git add tests/e2e/__snapshots__
          if git diff --cached --quiet; then
            echo "No snapshot changes detected"
            exit 0
          fi
          git commit -m "chore(snapshots): refresh baselines"
          git push origin "HEAD:${TARGET_BRANCH}"
