name: visual-regression

on:
  # Kein push:main mehr (2026-08-11): auf main lief die Suite an einem bereits
  # gemergten Commit. Das Gate ist vollstaendig der PR -- als Pflicht-Check `e2e`.
  # (deploy-pages.yml, auf das dieser Kommentar frueher verwies, existiert nicht mehr:
  # ausgeliefert wird ueber Cloudflare Pages, siehe AGENTS.md.)
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

# Als einziger Workflow hatte dieser keinen Top-Level-Block und erbte die
# Repo-Defaults (heute `read`, also folgenlos). Ein spaeter ergaenzter Job haette
# sie stillschweigend geerbt -- deshalb explizit leer, wie in unit-tests.yml.
# Der e2e-Job setzt sein `contents: read` selbst (Aegis-Audit 2026-08-11, P2).
permissions: {}

# Visual regression runs Playwright against the production build, taking
# canvas screenshots driven through real DOM controls + the <canvas> (no
# window/__TEST__ bridge — see AGENTS.md "e2e contract"). Snapshots are
# checked into the repo under tests/e2e/__snapshots__. Diffs cause the job
# to fail and upload the playwright-report artifact for inspection.
#
# We run inside the official Microsoft Playwright Docker image so that
# baselines and assertions execute against an identical font + library
# environment in CI and during snapshot refresh. This is the
# playwright.dev-recommended pattern for canvas-app visual stability.
# Pinning the image tag to the @playwright/test version keeps CI in lockstep
# with the local toolchain.
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      # tag v1.60.0-noble pinned by digest (resolved 2026-06-22)
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Cache the Playwright browser binaries between runs. The image
      # includes them but actions/setup-node lays a fresh node_modules so
      # we still need a place for npx playwright to resolve them quickly.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (skip if cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build production bundle
        run: npm run build

      - name: Run Playwright (visual + DOM-driven e2e)
        run: npx playwright test
        env:
          CI: "true"
          HOME: /root

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
