name: visual-regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Visual regression runs Playwright against the production build, taking
# canvas screenshots driven by the window.__TEST__ bridge. Snapshots are
# checked into the repo under tests/e2e/__snapshots__. Diffs cause the job
# to fail and upload the playwright-report artifact for inspection.
#
# We run inside the official Microsoft Playwright Docker image so that
# baselines and assertions execute against an identical font + library
# environment in CI and during snapshot refresh. This is the
# playwright.dev-recommended pattern for canvas-app visual stability.
# Pinning the image tag to the @playwright/test version keeps CI in lockstep
# with the local toolchain.
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.0.0
        with:
          node-version: 22
          cache: npm

      # Cache the Playwright browser binaries between runs. The image
      # includes them but actions/setup-node lays a fresh node_modules so
      # we still need a place for npx playwright to resolve them quickly.
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.2
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (skip if cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build production bundle
        run: npm run build

      - name: Run Playwright (visual + bridge)
        run: npx playwright test
        env:
          CI: "true"
          HOME: /root

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
