# Adoptiert den zentralen Reusable `mobile-render-verify` (coworkerz-ci) — EVALUATION_STRATEGY §8.1.
# Faengt die Desktop-vs-Mobile-Klasse, die am 06-09 zwei iPhone-only-Bugs durch desktop-CI durchliess:
# Form-/Geometrie-Assertion (mobile-hexshape) + deterministisches Perf-Budget unter CDP-Throttle (mobile-perf-budget).
# Laeuft NUR die 2 dedizierten Render/Perf-Specs (nicht-redundant zur vollen e2e/visual-regression).
name: mobile-render

on:
  # Kein push:main mehr (2026-08-11) -- Begruendung siehe unit-tests.yml Kopf.
  # Kein `branches:`-Filter (2026-09-27): auch gestapelte PRs auf Zwischenbranches
  # werden geprueft, siehe unit-tests.yml.
  pull_request:

concurrency:
  group: mobile-render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-render:
    uses: marcohost33-maker/coworkerz-ci/.github/workflows/mobile-render-verify.yml@40104a8cc2772b8563107c510660c51e12e2d367 # coworkerz-ci main (mobile-render-verify reusable)
    with:
      render-test-command: "npx playwright test --project=mobile tests/e2e/mobile-hexshape.spec.ts tests/e2e/mobile-perf-budget.spec.ts"
