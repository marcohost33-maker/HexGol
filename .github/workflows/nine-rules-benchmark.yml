name: nine-rules-benchmark

on:
  pull_request:
    branches: [ main ]
    paths:
      - "src/lib/nine-rules.js"
      - "experimental/bench-nine-rules.mjs"
      - "tests/unit/nine-rules-benchmark-smoke.test.js"
      - "package.json"
      - ".github/workflows/nine-rules-benchmark.yml"
  workflow_dispatch:

concurrency:
  group: nine-rules-benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Measure nine-rule evaluator
        run: npm run bench:nine-rules

      - name: Benchmark summary (observe-only)
        run: |
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("nine-rules-benchmark.json", "utf8"));
            const rows = r.rows.map(x => `| ${x.profile} | ${x.traceLength} | ${x.n} | ${x.p50Ms.toFixed(4)} | ${x.p95Ms.toFixed(4)} | ${x.meanMs.toFixed(4)} |`).join("\n");
            const md = [
              "## Nine-rule evaluator benchmark",
              "",
              `Node ${r.node} · ${r.platform}`,
              "",
              "| profile | trace length | samples | p50 ms | p95 ms | mean ms |",
              "|---|---:|---:|---:|---:|---:|",
              rows,
              "",
              "_Observe-only: no performance threshold. A single shared CI runner baseline is evidence, not a universal limit._",
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          '

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nine-rules-benchmark
          path: nine-rules-benchmark.json
          retention-days: 14
