# B3-Pilot Node-Typ (2026-06-04): zentrale Reusable-CI aus coworkerz-ci, ADDITIV
# neben unit-tests.yml (kein Ersatz, kein BP-Touch). SHA-gepinnt.
name: ci-reusable-pilot

on:
  # Kein push:main mehr (2026-08-11) -- Begruendung siehe deploy-pages.yml Kopf.
  # OFFENER BEFUND fuer User1: Dieser Pilot faehrt `npm test` + `npm run build` --
  # exakt das, was unit-tests.yml (Pflicht-Check `unit`) ohnehin faehrt. Seit dem
  # B3-Pilot vom 2026-06-04 wird jeder PR damit doppelt geprueft. Bewusst NICHT
  # eigenmaechtig abgeschaltet: die Adoption der zentralen coworkerz-ci ist eine
  # Portfolio-Entscheidung, keine Repo-Entscheidung. Wenn der Pilot ausgewertet
  # ist, faellt entweder er oder unit-tests.yml weg -- beide braucht es nicht.
  pull_request:
    branches: [main]

concurrency:
  group: ci-reusable-pilot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    uses: marcohost33-maker/coworkerz-ci/.github/workflows/ci-node.yml@511ae1bd35092429ddb8fb08e340a3c2c8bc9406
    with:
      node-version: "22"
      test-command: "npm test"
      build-command: "npm run build"
