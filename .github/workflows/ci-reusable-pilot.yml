    uses: marcohost33-maker/coworkerz-ci/.github/workflows/ci-node.yml@69d3bae0bd54792f499b01c1b6e1e8f6b452742b
    with:
      node-version: "22"
      test-command: "npm test"
      build-command: "npm run build"
