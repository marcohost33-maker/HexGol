# Deploy nach GitHub Pages -- fail-closed.
#
# WARUM ZWEI JOBS (2026-08-11): Vorher war dieser Workflow ein einzelner Job, der
# beim Push auf main SOFORT baute und deployte -- parallel zu unit-tests und
# visual-regression, ohne auf deren Urteil zu warten. Er fuhr zwar selbst `npm test`,
# aber nie die e2e-Suite. Damit konnte ein Stand live gehen, dessen Pflicht-Check
# `e2e` Minuten spaeter rot wurde. Genau das war am 2026-08-11 der Fall: der
# 9-Regel-Fix zog die Unit-Tests mit, aber nicht `nine-rules-panel.spec.ts` (das
# noch R4 erwartete) -- der alte Workflow haette den roten Stand veroeffentlicht.
# Jetzt gilt: erst `verify` gruen, dann `deploy`. Kein Deploy ohne Beleg.
#
# WARUM DAS BILLIGER IST, nicht teurer: Die vier Pruef-Workflows (unit-tests,
# visual-regression, mobile-render, ci-reusable-pilot) liefen zusaetzlich auf
# push:main -- an einem Commit, der bereits gemerged war. Ihr Gate-Wert liegt im
# PR, auf main waren sie folgenlose Nachkontrolle: 6 Jobs pro Merge, zusammen 5x
# `npm ci` und 4x `npm test`. Ihre push:main-Trigger sind entfernt; die Nachkontrolle
# uebernimmt `verify` hier -- strenger als vorher, weil sie den Deploy blockiert.
# Bilanz pro Merge: 2 Jobs statt 6.

name: deploy-pages

on:
  push:
    branches: [main]
    # Reine Doku aendert das Bundle nicht -- README/AGENTS/CLAUDE/docs landen nicht
    # in dist/. Ein Deploy dafuer waere ein Lauf ohne Wirkung.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # NICHT abbrechen: ein halb ausgerollter Produktions-Deploy ist schlimmer als ein
  # wartender. Entspricht der offiziellen Pages-Starter-Empfehlung; das vorherige
  # `cancel-in-progress: true` konnte einen laufenden Rollout mittendrin killen.
  cancel-in-progress: false

jobs:
  # Stufe 1: Beweisen, dass dieser Commit ausgeliefert werden darf.
  # Laeuft im selben gepinnten Playwright-Container wie visual-regression -- die
  # Screenshot-Baselines sind an dieses Image gebunden, auf nacktem ubuntu-latest
  # rendert Chromium anders und die visuellen Vergleiche reissen.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      # tag v1.60.0-noble pinned by digest (resolved 2026-06-22)
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (skip if cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Unit tests
        run: npm test

      # Bewusst OHNE GITHUB_PAGES: das setzt base auf "/HexGol/", Playwright faehrt
      # aber gegen http://127.0.0.1:4173/ (playwright.config.ts webServer + baseURL).
      # Mit Pages-Base liefe die ganze e2e-Suite gegen 404. Der Pages-Build passiert
      # im deploy-Job; er dauert ~0,6 s, das doppelte Bauen kostet praktisch nichts.
      - name: Build (neutraler Base, fuer die e2e-Suite)
        run: npm run build

      - name: e2e + visuelle Baselines
        run: npx playwright test

      - name: Playwright-Report bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report-deploy
          path: playwright-report/
          retention-days: 7

  # Stufe 2: Erst jetzt ausliefern.
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hier MIT GITHUB_PAGES -- base "/HexGol/", weil die Seite unter dem
      # Repo-Pfad ausgeliefert wird (vite.config.js).
      - name: Build for GitHub Pages project site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
