name: Encoding Guard

on:
  # `branches: [main]` beim Push ergaenzt 2026-08-11. Vorher hatte der push-Trigger
  # KEINEN Branch-Filter: jeder Push auf einen Feature-Branch loeste ihn aus, und der
  # zugehoerige Pull-Request dann ein zweites Mal. Belegt am PR #138 -- die Pruefung
  # "Reject invalid UTF-8 in .github" stand dort zweimal mit verschiedenen Run-IDs.
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

concurrency:
  group: encoding-guard-${{ github.ref }}
  cancel-in-progress: true

# Least privilege; the job only needs to read the checked-out tree.
permissions: {}

jobs:
  utf8:
    name: Reject invalid UTF-8 in .github
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate UTF-8 (binary-safe; catches CP-1252 0x97 that breaks zizmor)
        run: |
          python3 - <<'PY'
          import pathlib, sys
          bad = []
          for p in pathlib.Path(".github").rglob("*"):
              if not p.is_file():
                  continue
              data = p.read_bytes()
              if b"\x00" in data:        # binary file (git's own heuristic) -> skip
                  continue
              try:
                  data.decode("utf-8")
              except UnicodeDecodeError as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("::error::Invalid UTF-8 (e.g. CP-1252 0x97) found in .github/:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("OK: all text files in .github/ are valid UTF-8.")
          PY
