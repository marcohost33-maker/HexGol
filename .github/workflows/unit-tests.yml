name: unit-tests

on:
  # Kein push:main mehr (2026-08-11): auf main lief dieser Workflow an einem bereits
  # gemergten Commit und konnte nichts mehr verhindern. Das Gate ist der PR; die
  # Nachkontrolle auf main macht jetzt der verify-Job in deploy-pages.yml, wo sie
  # den Deploy tatsaechlich blockiert. Als Pflicht-Check `unit` weiterhin am PR.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  # Neuer Push auf denselben PR loest den alten Lauf ab, statt beide zu bezahlen.
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --reporter=verbose

      - name: Build production bundle (smoke check)
        run: npm run build

  # Coverage is MEASURE-FIRST (Test-Center T4): it reports the number but does
  # NOT gate the build. This job is intentionally not a required check and sets
  # no threshold, so a low/regressing number cannot block a merge yet. Marco/Vero
  # set the enforced floor later, once the Ist-baseline is observed.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest coverage (v8, observe-only)
        run: npm run test:coverage

      - name: Coverage summary -> job summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const rows = ["statements","branches","functions","lines"]
                .map(k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`)
                .join("\n");
              const md = [
                "## Coverage (measure-first — no gate)",
                "",
                "| metric | % | covered/total |",
                "|---|---|---|",
                rows,
                "",
                "_Observe-only: no threshold enforced yet (Test-Center T4)._",
              ].join("\n");
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
            '
          else
            echo "coverage-summary.json not found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage
          retention-days: 14
