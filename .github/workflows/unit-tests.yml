name: unit-tests

on:
  # Kein push:main mehr (2026-08-11): auf main lief dieser Workflow an einem bereits
  # gemergten Commit und konnte nichts mehr verhindern. Das Gate ist vollstaendig der
  # PR -- als Pflicht-Check `unit`. Nach dem Merge deployt NICHTS von selbst: das
  # Pages-Projekt `golhex` hat keinen Git-Provider (`wrangler pages project list`
  # -> Spalte "Git Provider: No"), der Deploy wird VON HAND angestossen. Hier stand
  # bis 2026-08-11 "Nach dem Merge baut Cloudflare Pages aus main" -- das war falsch
  # und genau der Grund, warum ein Deploy-Rueckstand still bleiben konnte: wer den
  # Satz las, wartete auf eine Automatik, die es nie gab.
  # Geprueft wird die Auslieferung ueber /version.json gegen `git rev-parse HEAD`
  # (siehe AGENTS.md, Deploy-Abschnitt), nicht ueber einen gruenen Job.
  #
  # B3-Pilot BEENDET (2026-08-11, User1-Entscheid): ci-reusable-pilot.yml ist
  # entfernt. Er fuhr `npm test` + `npm run build` -- exakt das, was der Job `unit`
  # unten ohnehin faehrt -- und pruefte damit jeden PR seit dem 2026-06-04 doppelt.
  # Gemessen: 14 CI-Laeufe fuer EINEN Dokumentations-PR, weil pro Sync 5-6
  # Workflows feuerten. Die zentrale coworkerz-ci bleibt im Einsatz, hier ueber
  # mobile-render.yml und zizmor.yml -- beendet ist nur die Dublette.
  # Wer sie wieder einfuehren will: dann faellt DIESER Workflow weg, nicht beide.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  # Neuer Push auf denselben PR loest den alten Lauf ab, statt beide zu bezahlen.
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --reporter=verbose

      - name: Build production bundle (smoke check)
        run: npm run build

  # Vite 8 requires Node ^20.19.0 or >=22.12.0, and package.json now declares
  # exactly that range. Keep the required `unit` context stable on Node 22, but
  # exercise the earliest actually supported Node release separately so a green
  # job proves the lower bound rather than merely "some Node 20".
  node20-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm

      # npm's linked layout intentionally avoids top-level hoisting of undeclared
      # packages. This makes a direct import that is missing from package.json fail
      # here instead of succeeding accidentally through a transitive dependency
      # (#181). The normal unit lane above still exercises the default layout.
      - name: Install isolated dependency graph (phantom-dependency gate)
        run: npm ci --install-strategy=linked

      - name: Verify npm-normalized manifest and lockfile are stable
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package.json package-lock.json

      - name: Build production bundle at the declared minimum Node version
        run: npm run build

  # Coverage is MEASURE-FIRST (Test-Center T4): it reports the number but does
  # NOT gate the build. This job is intentionally not a required check and sets
  # no threshold, so a low/regressing number cannot block a merge yet. Marco/Vero
  # set the enforced floor later, once the Ist-baseline is observed.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest coverage (v8, observe-only)
        run: npm run test:coverage

      - name: Coverage summary -> job summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const rows = ["statements","branches","functions","lines"]
                .map(k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`)
                .join("\n");
              const md = [
                "## Coverage (measure-first — no gate)",
                "",
                "| metric | % | covered/total |",
                "|---|---|---|",
                rows,
                "",
                "_Observe-only: no threshold enforced yet (Test-Center T4)._",
              ].join("\n");
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
            '
          else
            echo "coverage-summary.json not found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage
          retention-days: 14
