<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GolHex">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1b2230"/>
      <stop offset="100%" stop-color="#0f1216"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>
  <!-- Conway glider: cells (0,1)(1,2)(2,0)(2,1)(2,2) on a 3x3 raster -->
