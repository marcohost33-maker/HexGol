    <rect x="26" y="10" width="11" height="11" rx="2.5"/>
    <rect x="40" y="24" width="11" height="11" rx="2.5"/>
    <rect x="12" y="38" width="11" height="11" rx="2.5"/>
    <rect x="26" y="38" width="11" height="11" rx="2.5"/>
    <rect x="40" y="38" width="11" height="11" rx="2.5"/>
  </g>
</svg>
