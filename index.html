<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1216" />
    <meta name="description" content="GolHex - Hexagonal Game of Life with HQST quantum mode" />
    <title>GolHex</title>
    <!-- GolHex branding (Conway glider + GOL mark). SVG favicon with PNG fallbacks. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="GolHex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <style>
      /*
        Typografie (#163): system-first, kein Schrift-Download, keine fremde
        Herkunft. Hier standen bis 2026-09-12 zwei Preconnects und ein
        Stylesheet-Link auf die Google-Fonts-Origins -- die Produktions-CSP
        (`font-src 'self'` in public/_headers) blockierte sie, lokal luden sie
        durch, und die Schrift wich live von der Entwicklung ab. Die Hostnamen
        stehen hier absichtlich NICHT ausgeschrieben: der Quell-Waechter sucht
        wortwoertlich und darf an einem Kommentar nicht vorbeisehen muessen.
        Diese beiden Custom-Properties sind die Spiegelung von
        src/lib/typography.js (FONT_SANS/FONT_MONO); sie stehen hier, damit der
        erste Frame vor dem React-Mount schon richtig setzt. Zeichengleichheit
        beider Stellen prueft tests/unit/csp-fonts.test.js.
      */
      :root {
        --ghx-font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --ghx-font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      html, body, #root { height: 100%; margin: 0; }
      body { background: #000; color: #E8F5F2; overscroll-behavior: none; font-family: var(--ghx-font-sans); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
